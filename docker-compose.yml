services:
  bot:
    image: ghcr.io/devvyyxyz/cab-bot:latest
    pull_policy: always
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cab-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    volumes:
      - ./data:/app/data
    ports:
      - "3000:3000"
